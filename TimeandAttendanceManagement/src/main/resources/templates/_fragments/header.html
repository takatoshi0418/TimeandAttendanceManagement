<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<!--/* ヘッダーは layout.html で定義済みのため、ここでは記述しない */-->

<head></head>

<body>
    <header layout:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">

                <!--/* システム名: PC 左端(0)、 スマホ 左から2番目(1) */-->
                <a class="navbar-brand order-1 order-lg-0" th:text="#{common.systemName}" th:href="@{/dashboard}"></a>

                <!--/* ナビゲーションメニュー: PC左側(1) スマホ(下) */-->
                <div class="collapse navbar-collapse order-4 order-lg-1" id="navbarMenu">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" th:text="#{attendance.title}"
                                th:href="@{/attendance/attendance-report}"></a>
                        </li>
                    </ul>
                </div>

                <!--/* ユーザー情報 PC 右端(3)、スマホ(右端) */-->
                <div class="dropdown order-3 ms-auto">
                    <button class="nav-link dropdown-toggle btn btn-link text-light" id="navbarDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false" type="button">
                        <i class="bi bi-person-circle"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button class="dropdown-item btn btn-link" type="submit"
                                    th:text="#{dashboard.button.logout}"></button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!--/* トグルボタン: スマホのみ表示 */-->
                <button class="navbar-toggler order-0 d-lg-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
    </header>
</body>

</html>
