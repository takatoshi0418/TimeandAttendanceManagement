<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{login.title}"></title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" th:text="#{common.systemName}"></a>
      </div>
    </nav>
  </header>

  <main class="container mt-5">
    <!-- エラーメッセージの表示 -->
    <div th:if="${param.error}">
      <div class="alert alert-danger" role="alert">
        <span th:text="#{error.login.invalid}"></span>
      </div>
    </div>

    <!-- ログインフォーム -->
    <form th:action="@{/login}" method="post">
      <div class="row">
        <div class="col-8 mx-auto">
          <input id="username" class="form-control" type="text" name="username"
            th:placeholder="#{login.label.username}" />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-8 mx-auto">
          <input id="password" class="form-control" type="password" name="password"
            th:placeholder="#{login.label.password}" />
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-8 mx-auto">
          <div class="d-grid col-7 mx-auto">
            <button class="btn btn-primary" type="submit" th:text="#{login.button.login}"></button>
          </div>
        </div>
      </div>
    </form>
  </main>
  <footer th:replace="~{_fragments/footer :: footer}"></footer>
</body>

</html>
